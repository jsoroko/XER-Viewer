# Runs inside the container (nginx-unprivileged, port 8080).
# The app is entirely static: there is no API and no client-side routing, so a missing
# file is a real 404, not a fall-back to index.html.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # Newer nginx maps .js to text/javascript (older releases used application/javascript); list both.
    gzip_types text/css text/javascript application/javascript image/svg+xml application/json;

    # The app makes no network requests of its own, and the policy enforces that:
    # scripts, styles and images may only come from this origin, and nothing may connect elsewhere.
    # 'unsafe-inline' for styles is needed because the UI positions the Gantt bars with style attributes.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Build output is content-hashed (chunk-<hash>.js, .css), so it can be cached for a year.
    # (`expires` is used instead of add_header so the security headers above still apply.)
    location ~* \.(?:js|css|svg|map)$ {
        expires 1y;
        try_files $uri =404;
    }

    # index.html names the current hashed files: always revalidate so a deploy shows up at once.
    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }

    # For quick checks: curl http://127.0.0.1:3100/healthz
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
